<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sféristika</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background-image: url("pozadi-magie.jpg");
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
    color: #e8dfcf;
    font-family: Georgia, "Times New Roman", serif;
    padding: 30px 20px;
}

.page {
    width: min(1200px, 96vw);
    margin: 0 auto;
    padding: 30px 35px 35px;
    border: 2px solid #6f5a3e;
    box-shadow:
        0 0 40px rgba(0,0,0,.75),
        inset 0 0 50px rgba(0,0,0,.4);
    background: rgba(18,15,12,.90);
}

h1 {
    margin: 0 0 25px;
    text-align: center;
    font-size: clamp(32px, 5vw, 52px);
    font-weight: normal;
    letter-spacing: 2px;
    text-shadow: 0 3px 8px #000;
}

.vyber {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 20px;
}

button {
    min-width: 0;
    padding: 16px 18px;
    font-family: inherit;
    font-size: clamp(17px, 2vw, 22px);
    color: #eee4d2;
    background: linear-gradient(180deg, #403222 0%, #241b13 100%);
    border: 1px solid #8a704d;
    border-radius: 4px;
    cursor: pointer;
    box-shadow:
        0 3px 8px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,230,180,.08);
    transition: background .2s, border-color .2s;
}

button:hover {
    background: linear-gradient(180deg, #51402b 0%, #332519 100%);
    border-color: #b39468;
}

button.aktivni {
    background: linear-gradient(180deg, #665033 0%, #382719 100%);
    border-color: #d0ad77;
    box-shadow: 0 0 10px rgba(190,165,125,.25);
}

.obsah {
    width: 100%;
    height: 75vh;
    min-height: 520px;
    display: block;
    border: 1px solid #6f5a3e;
    background: rgba(18,15,12,.96);
}

.zpet {
    display: block;
    margin: 22px auto 0;
    padding: 12px 28px;
    font-size: 19px;
}

@media (max-width: 650px) {
    body {
        padding: 15px 8px;
    }

    .page {
        width: 100%;
        padding: 22px 12px;
    }

    .vyber {
        grid-template-columns: 1fr;
        gap: 9px;
    }

    button {
        padding: 13px 12px;
    }

    .obsah {
        height: 72vh;
        min-height: 420px;
    }
}
</style>
</head>

<body>
<main class="page">
    <h1>Sféristika</h1>

    <nav class="vyber" aria-label="Výběr magické školy">
        <button type="button" class="aktivni"
            data-soubor="moc_prazdnota.html"
            onclick="zobrazitMoc(this)">Moc Prázdnota</button>

        <button type="button"
            data-soubor="moc_zivot.html"
            onclick="zobrazitMoc(this)">Moc Život</button>

        <button type="button"
            data-soubor="moc_matera.html"
            onclick="zobrazitMoc(this)">Moc Matera</button>
    </nav>

<iframe id="obsahMagie" class="obsah" src="" title="Obsah vybrané magické školy"></iframe>

    <button type="button" class="zpet" onclick="window.close()">Zavřít</button>
</main>

<script>
const parametry = new URLSearchParams(window.location.search);
const idPostavy = parametry.get("id");

if (idPostavy) {
    document.getElementById("obsahMagie").src =
        `moc_prazdnota.html?id=${encodeURIComponent(idPostavy)}`;
}
function zobrazitMoc(tlacitko) {
    const iframe = document.getElementById("obsahMagie");
    const soubor = tlacitko.dataset.soubor;

   iframe.src = `${soubor}?id=${encodeURIComponent(idPostavy)}`;

    document.querySelectorAll(".vyber button").forEach(button => {
        button.classList.toggle("aktivni", button === tlacitko);
    });
}
</script>
</body>
</html>
