<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vítejte dobrodruzi</title>
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-image: url("pozadi-index.jpg");
        background-attachment: fixed;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;        
        color: #e8dfcf;
        font-family: Georgia, "Times New Roman", serif;
    }
 
.page {
    width: min(1100px, 96vw);
    min-height: 600px;
    padding: 45px 35px 20px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;

    border: 2px solid #6f5a3e;

    box-shadow:
        0 0 40px rgba(0,0,0,.75),
        inset 0 0 50px rgba(0,0,0,.4);

    background: rgba(18,15,12,.92);
}
   
h1 {
    margin: 0 0 55px;
    font-size: clamp(42px, 7vw, 76px);
    font-weight: normal;
    letter-spacing: 4px;
    color: #d8bd8b;
    text-shadow:
        0 2px 3px #000,
        0 0 18px rgba(180, 130, 65, 0.3);
    text-align: center;
}

    
    #stavPrihlaseni {
    margin-top: -35px;
    margin-bottom: 25px;
    text-align: center;
    font-size: 18px;
}
    button {
        padding: 17px 34px;
        font: inherit;
        font-size: 22px;
        color: #eee4d2;
        background: #33291e;
        border: 1px solid #8a704d;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(0,0,0,.5);
  
    }
    #tlacitkoAdmin[hidden] {
    display: none !important;
}
    button:hover {
        background: #473827;
        border-color: #b39468;
        
    }
   
button {
    padding: 17px 34px;
    font-family: inherit;
    font-size: 22px;
    color: #eee4d2;
    background: linear-gradient(
        180deg,
        #403222 0%,
        #241b13 100%
    );
    border: 1px solid #8a704d;
    border-radius: 4px;
    cursor: pointer;
    box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 230, 180, 0.08);
    transition: background 0.2s, border-color 0.2s;
}



    #seznamPostav {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    margin-top: 35px;
}



.postava {
    position: relative;
    display: block;
    width: 100%;
    min-width: 0;
    padding: 16px 30px;

    text-align: center;
    text-decoration: none;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    letter-spacing: 1px;

    color: #e8d5b2;
    background:
        linear-gradient(135deg, #30251b, #19130f 55%, #30251b);

    border: 1px solid #806744;
    outline: 1px solid rgba(128, 103, 68, 0.35);
    outline-offset: 3px;

    box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.5),
        inset 0 0 18px rgba(180, 130, 65, 0.08);

    transition: background 0.2s, border-color 0.2s;
}

/* Drobné ornamenty po stranách */
.postava::before,
.postava::after {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: #b39468;
    font-size: 18px;
}

.postava::before {
    content: "❧";
    left: 9px;
}

.postava::after {
    content: "❧";
    right: 9px;
    transform: translateY(-50%) scaleX(-1);
}

.postava:hover {
    color: #fff0d1;
    background: linear-gradient(135deg, #493724, #2b2016, #493724);
    border-color: #c4a16b;
    outline-color: rgba(196, 161, 107, 0.6);
    box-shadow:
        0 4px 14px rgba(0, 0, 0, 0.6),
        inset 0 0 22px rgba(180, 130, 65, 0.13);
}


.radek-postavy {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
}

.radek-postavy .postava {
    flex: 1;
}

.smazat-postavu {
    min-width: 42px;
    padding: 10px 12px;

    font-size: 18px;
    color: #c9a99a;

    background: #2b1d1a;
    border: 1px solid #67453d;
}

.smazat-postavu:hover {
    background: #4a2923;
    border-color: #9a6255;
}
.hlaska-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.65);
    z-index: 1000;
}

.hlaska-okno {
    width: min(420px, 85vw);
    padding: 25px;
    text-align: center;

    color: #e8dfcf;
    background: #18130f;
    border: 2px solid #6f5a3e;
    box-shadow: 0 0 30px rgba(0,0,0,.8);
}

.hlaska-text {
    margin-bottom: 22px;
    font-size: 19px;
    line-height: 1.5;
}

.hlaska-tlacitka {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.hlaska-tlacitka button {
    min-width: 90px;
    padding: 9px 18px;
    margin: 0;
    font-size: 17px;
}

.hlaska-ne {
    background: #2b1d1a;
    border-color: #67453d;
}

.hlaska-ne:hover {
    background: #4a2923;
    border-color: #9a6255;
}
.paticka {
    margin-top: 30px;
    padding: 15px;
    text-align: center;
    color: #8f806b;
    font-size: 12px;
    line-height: 1.6;
}

.paticka span {
    font-style: italic;
}

#prihlaseni {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
    max-width: 100%;
}

.udaje-prihlaseni {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    width: 100%;
}

#prihlaseni input {
    flex: 0 1 260px;
    width: 260px;
    min-width: 0;
    margin: 0;
}

.tlacitka-prihlaseni {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    width: 100%;
}

.tlacitka-prihlaseni button {
    margin: 0;
}


/* Oddělení přihlašování od dalších akcí */
.page > button {
    margin-top: 18px;
}


.hlavni-obsah {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 35px;
    width: 100%;
    margin-top: 100px;
    align-items: start;
}

.leva-strana,
.prava-strana {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    min-width: 0;
}

.leva-strana #seznamPostav {
    margin-top: 0;
    width: 100%;
    max-width: 400px;
}

@media (max-width: 650px) {
    .hlavni-obsah {
        grid-template-columns: 1fr;
        gap: 25px;
    }
}
.nadpis-postav {
    margin: 12px 0 0;
    font-size: 22px;
    color: #d6bd91;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xahjqqyjaxbhdmairkfr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OBIbH7JzU_A96jXlht_2FA_Yadsooqu";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>
</head>
<body>
    <main class="page">

    <h1>Vítejte dobrodruzi</h1>
    
 <div id="stavPrihlaseni"></div>
<div id="prihlaseni">
    <div class="udaje-prihlaseni">
        <input
            type="email"
            id="email"
            placeholder="E-mail"
        >

        <input
            type="password"
            id="heslo"
            placeholder="Heslo"
        >
    </div>

    <div class="tlacitka-prihlaseni">
        <button id="tlacitkoPrihlaseni" onclick="prihlasit()">
            Přihlásit
        </button>

        <button type="button" onclick="window.location.href='registrace.html'">
            Registrovat se
        </button>

        <button type="button" onclick="zapomenuteHeslo()">
            Zapomenuté heslo
        </button>
    </div>
</div>


<div class="hlavni-obsah">
   
<div class="leva-strana">
    <button onclick="vytvoritPostavu()">Vytvořit novou postavu</button>

    <h2 class="nadpis-postav">Tvé postavy</h2>

    <div id="seznamPostav"></div>
</div>

    <div class="prava-strana">
        <button type="button" onclick="window.open('pravidla.html', '_blank')">
            Pravidla
        </button>

        <button
            type="button"
            id="tlacitkoAdmin"
            hidden
            onclick="window.location.href='admin/admin.html'">
            Administrace
        </button>
    </div>
</div>

    <div class="paticka">
        Vytvořila Larion ve spolupráci s Gerym, nejlepším Chat-GPT<br>
        <span>(Gemini je šupák, co neumí počítat)</span><br>
        za malé podpory Sekáče a vůbec žádné podpory Euroxe.
    </div>

</main>
   

<script>

async function zkontrolovatAdmina(userId) {
    const tlacitko = document.getElementById("tlacitkoAdmin");

    // Ve výchozím stavu odkaz nezobrazujeme.
    tlacitko.hidden = true;

    if (!userId) {
        return;
    }

    const { data, error } = await supabaseClient
        .from("admini")
        .select("user_id")
        .eq("user_id", userId)
        .maybeSingle();

    if (error) {
        console.error("Nepodařilo se ověřit administrátora:", error);
        return;
    }

    tlacitko.hidden = !data;
    
}

async function zkontrolovatPrihlaseni() {

    const { data: { session } } =
        await supabaseClient.auth.getSession();

    if (session && session.user) {
    
await zkontrolovatAdmina(session.user.id);
        document.getElementById("stavPrihlaseni").textContent =
            "Přihlášeno.";

        document.getElementById("tlacitkoPrihlaseni").textContent =
            "Odhlásit";

        document.getElementById("tlacitkoPrihlaseni").onclick =
            odhlasit;

        zobrazitPostavy();

    } else {
document.getElementById("tlacitkoAdmin").hidden = true;
        document.getElementById("stavPrihlaseni").textContent = "";

        document.getElementById("tlacitkoPrihlaseni").textContent =
            "Přihlásit";

        document.getElementById("tlacitkoPrihlaseni").onclick =
            prihlasit;

        document.getElementById("seznamPostav").innerHTML = "";
    }
}

async function vytvoritPostavu() {

    const { data: { user } } =
        await supabaseClient.auth.getUser();

    if (!user) {
        zobrazitHlaskuZavrit("Nejdřív se musíš přihlásit.");
        return;
    }

    console.log("Přihlášený uživatel:", user.id);

    window.location.href = "nova_postava.html";
}




async function zobrazitPostavy() {

    const seznam = document.getElementById("seznamPostav");

    const { data: postavy, error } = await supabaseClient
        .from("postavy")
        .select("id, jmeno")
        .order("id", { ascending: true });

    if (error) {
        console.error("Chyba při načítání postav:", error);
        seznam.innerHTML = "<div>Postavy se nepodařilo načíst.</div>";
        return;
    }

    seznam.innerHTML = "";

    postavy.forEach(function(postava) {

        const radek = document.createElement("div");
        radek.className = "radek-postavy";

        const odkaz = document.createElement("a");

        odkaz.className = "postava";
        odkaz.textContent = postava.jmeno;

        odkaz.href =
            "postava.html?id=" +
            encodeURIComponent(postava.id);

        const smazat = document.createElement("button");

        smazat.className = "smazat-postavu";
        smazat.textContent = "×";
        smazat.title = "Smazat postavu";

        smazat.onclick = function() {

            zobrazitHlasku(
                "Opravdu chceš smazat postavu „" +
                postava.jmeno +
                "“?",
                async function(potvrdit) {

                    if (!potvrdit) {
                        return;
                    }

                    const { error } = await supabaseClient
                        .from("postavy")
                        .delete()
                        .eq("id", postava.id);

                    if (error) {
                        console.error(
                            "Chyba při mazání postavy:",
                            error
                        );
                        return;
                    }

                    zobrazitPostavy();
                }
            );
        };

        radek.appendChild(odkaz);
        radek.appendChild(smazat);

        seznam.appendChild(radek);
    });
}
function zobrazitHlasku(text, callback) {

    document.getElementById("hlaskaAno").style.display = "inline-block";
    document.getElementById("hlaskaNe").style.display = "inline-block";
    document.getElementById("hlaskaZavrit").style.display = "none";

    document.getElementById("hlaskaText").textContent = text;
    document.getElementById("hlaskaOverlay").style.display = "flex";

    document.getElementById("hlaskaAno").onclick = function() {
        document.getElementById("hlaskaOverlay").style.display = "none";
        callback(true);
    };

    document.getElementById("hlaskaNe").onclick = function() {
        document.getElementById("hlaskaOverlay").style.display = "none";
        callback(false);
    };
 
}
function zobrazitHlaskuZavrit(text) {

    document.getElementById("hlaskaAno").style.display = "none";
    document.getElementById("hlaskaNe").style.display = "none";
    document.getElementById("hlaskaZavrit").style.display = "inline-block";

    document.getElementById("hlaskaText").textContent = text;
    document.getElementById("hlaskaOverlay").style.display = "flex";

    document.getElementById("hlaskaZavrit").onclick = function() {
        document.getElementById("hlaskaOverlay").style.display = "none";
    };
}

async function zapomenuteHeslo() {

    const email = document.getElementById("email").value.trim();

    if (!email) {
        zobrazitHlaskuZavrit("Nejdřív zadej svůj e-mail.");
        return;
    }

    console.log("Posílám žádost o obnovu hesla pro:", email);

    const { data, error } =
        await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
                redirectTo:
                    "https://larion11.github.io/Tyoris/obnova-hesla.html"
            }
        );

    console.log("Výsledek resetu:", data, error);

    if (error) {
        console.error("Chyba při odesílání odkazu:", error);

        zobrazitHlaskuZavrit(
            "Odkaz pro obnovení hesla se nepodařilo odeslat."
        );

        return;
    }

    zobrazitHlaskuZavrit(
        "Na e-mail byl odeslán odkaz pro obnovení hesla."
    );
}
async function prihlasit() {

    const email = document.getElementById("email").value;
    const heslo = document.getElementById("heslo").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: heslo
    });

    if (error) {
        document.getElementById("stavPrihlaseni").textContent =
            "Přihlášení se nepodařilo: " + error.message;

        console.log(error);
        return;
    }

document.getElementById("stavPrihlaseni").textContent =
    "Přihlášeno.";

document.getElementById("tlacitkoPrihlaseni").textContent =
    "Odhlásit";

document.getElementById("tlacitkoPrihlaseni").onclick =
    odhlasit;

console.log("Přihlášený uživatel:", data.user);

await zkontrolovatAdmina(data.user.id);
zobrazitPostavy();
}
async function odhlasit() {

    const { error } = await supabaseClient.auth.signOut();

    if (error) {
        console.error("Chyba při odhlašování:", error);
        return;
    }

    document.getElementById("stavPrihlaseni").textContent =
        "Odhlášeno.";

    document.getElementById("tlacitkoPrihlaseni").textContent =
        "Přihlásit";

    document.getElementById("tlacitkoPrihlaseni").onclick =
        prihlasit;
document.getElementById("tlacitkoAdmin").hidden = true;
    document.getElementById("seznamPostav").innerHTML = "";
}

zkontrolovatPrihlaseni();

</script>
<div id="hlaskaOverlay" class="hlaska-overlay">
    <div class="hlaska-okno">
        <div id="hlaskaText" class="hlaska-text"></div>

       <div class="hlaska-tlacitka">
    <button id="hlaskaAno">Ano</button>
    <button id="hlaskaNe" class="hlaska-ne">Ne</button>
    <button id="hlaskaZavrit">Zavřít</button>
</div>
    </div>
</div>

</body>
</html>
