<script>

const parametry = new URLSearchParams(window.location.search);
const idPostavy = parametry.get("id");

let postava = null;
let cenikData = {};

async function nacistCenik() {

    const { data, error } = await supabaseClient
        .from("cenik")
        .select("obsah")
        .eq("id", 1)
        .single();

    if (error) {
        console.error("Chyba při načítání ceníku:", error);
        return;
    }

    cenikData = data.obsah || {};
}

async function nacistPostavu() {

    const { data: radek, error } = await supabaseClient
        .from("postavy")
        .select("*")
        .eq("id", idPostavy)
        .single();

    if (error) {
        console.error("Chyba při načítání postavy:", error);

        document.getElementById("info").textContent =
            "Postavu se nepodařilo načíst.";

        return;
    }

    postava = {
        ...(radek.data || {}),
        id: String(radek.id),
        jmeno: radek.jmeno,
        popis: radek.popis
    };

    document.getElementById("info").textContent =
        postava.jmeno || "Bez jména";

    await nacistCenik();

    nacistInventar();
}


function najitPredmetVCeniku(nazev) {

    function prohledat(objekt) {

        if (!objekt || typeof objekt !== "object") {
            return null;
        }

        if (Array.isArray(objekt)) {

            for (const polozka of objekt) {

                if (polozka && polozka.nazev === nazev) {
                    return polozka;
                }

                const vysledek = prohledat(polozka);

                if (vysledek) {
                    return vysledek;
                }
            }

        } else {

            for (const hodnota of Object.values(objekt)) {

                const vysledek = prohledat(hodnota);

                if (vysledek) {
                    return vysledek;
                }
            }
        }

        return null;
    }

    return prohledat(cenikData);
}

function jeVakNaVodu(nazev) {
    return /^Vak na vodu (3|6) l$/i.test(
        String(nazev || "").trim()
    );
}

function kapacitaVaku(nazev) {
    const shoda = String(nazev || "").match(
        /^Vak na vodu (3|6) l$/i
    );

    return shoda ? Number(shoda[1]) : 0;
}

function mnozstviVodyVeVaku(vak) {
    if (!vak || !jeVakNaVodu(vak.predmet)) {
        return 0;
    }

    const kapacita = kapacitaVaku(vak.predmet);
    const voda = Number(vak.voda_litru) || 0;

    return Math.max(0, Math.min(kapacita, voda));
}

function htmlUkazatelVody(vak) {
    if (!jeVakNaVodu(vak?.predmet)) return "";

    const kapacita = kapacitaVaku(vak.predmet);
    const voda = mnozstviVodyVeVaku(vak);
    const procenta = kapacita > 0
        ? (voda / kapacita) * 100
        : 0;

    return `
        <div class="voda-obsazenost">
            <div class="voda-ukazatel">
                <div class="voda-ukazatel-vypln"
                    style="width: ${procenta}%">
                </div>
            </div>
            <span class="voda-cislo">
                ${voda} / ${kapacita} l
            </span>
        </div>
    `;
}

function celkemVody() {
    const zavazadla = postava?.inventar?.zavazadla || [];

    return zavazadla.reduce((celkem, zavazadlo) => {
        celkem += mnozstviVodyVeVaku(zavazadlo);

        (zavazadlo.obsah || []).forEach(predmet => {
            celkem += mnozstviVodyVeVaku(predmet);
        });

        (zavazadlo.vnejsi_poutka || []).forEach(predmet => {
            celkem += mnozstviVodyVeVaku(predmet);
        });

        return celkem;
    }, 0);
}

function najitVakyNaVodu() {
    const zavazadla = postava?.inventar?.zavazadla || [];
    const vaky = [];

    zavazadla.forEach(zavazadlo => {

        // Z nedostupného zavazadla nelze použít žádný vak.
        if (zavazadlo.nedostupne) return;

        // Vak přímo na opasku.
        if (
            jeVakNaVodu(zavazadlo.predmet) &&
            !zavazadlo.nedostupne
        ) {
            vaky.push(zavazadlo);
        }

        // Vaky uvnitř zavazadla.
        (zavazadlo.obsah || []).forEach(predmet => {
            if (
                jeVakNaVodu(predmet.predmet) &&
                !predmet.nedostupne
            ) {
                vaky.push(predmet);
            }
        });

        // Vaky na vnějších poutkách.
        (zavazadlo.vnejsi_poutka || []).forEach(predmet => {
            if (
                predmet &&
                jeVakNaVodu(predmet.predmet) &&
                !predmet.nedostupne
            ) {
                vaky.push(predmet);
            }
        });
    });

    return vaky;
}

function popisUmisteniVaku(vak) {
    const zavazadla = postava?.inventar?.zavazadla || [];

    for (const zavazadlo of zavazadla) {
        if (zavazadlo.id === vak.id) {
            return "na opasku";
        }

        if ((zavazadlo.obsah || []).some(p => p.id === vak.id)) {
            return `v zavazadle: ${zavazadlo.predmet}`;
        }

        const indexPoutka = (zavazadlo.vnejsi_poutka || [])
            .findIndex(p => p?.id === vak.id);

        if (indexPoutka !== -1) {
            return `na vnějším poutku ${zavazadlo.predmet} č. ${indexPoutka + 1}`;
        }
    }

    return "umístění neznámé";
}

function zobrazitVyberAktivnihoVaku() {
    const select = document.getElementById("aktivniVakNaVodu");
    if (!select) return;

    const vaky = najitVakyNaVodu();
    const inventar = postava.inventar;

    select.innerHTML = "";

    const prazdnaVolba = document.createElement("option");
    prazdnaVolba.value = "";
    prazdnaVolba.textContent = "Žádný vak nevybrán";
    select.appendChild(prazdnaVolba);

    vaky.forEach(vak => {
        const moznost = document.createElement("option");
        moznost.value = vak.id;
       moznost.textContent =
    `${vak.predmet} – ${popisUmisteniVaku(vak)} (${mnozstviVodyVeVaku(vak)} l)`;
        select.appendChild(moznost);
    });

    const existuje = vaky.some(
        vak => vak.id === inventar.aktivniVakNaVodu
    );

    if (!existuje) {
        inventar.aktivniVakNaVodu = null;
    }

    select.value = inventar.aktivniVakNaVodu || "";
}

async function zmenitAktivniVakNaVodu(idVaku) {
    postava.inventar.aktivniVakNaVodu = idVaku || null;
    await ulozitInventar();
}

async function naplnitVakNaVodu(idVaku) {
    const vak = najitVakyNaVodu().find(
        polozka => polozka.id === idVaku
    );

    if (!vak) return;

    vak.voda_litru = kapacitaVaku(vak.predmet);

    zobrazitZavazadla();
    await ulozitInventar();
}

async function napitSe() {
    const idVaku = postava.inventar.aktivniVakNaVodu;

    const vak = najitVakyNaVodu().find(
        polozka => polozka.id === idVaku
    );

    if (!vak) {
        zobrazitHlasku(
            "Nejdřív vyber vak, ze kterého chceš čerpat vodu.",
            "Není vybraný vak"
        );
        return;
    }

    const aktualniVoda = Number(vak.voda_litru) || 0;

    if (aktualniVoda < 0.5) {
        zobrazitHlasku(
            "Ve vybraném vaku není dost vody na jednu dávku.",
            "Nedostatek vody"
        );
        return;
    }

    vak.voda_litru = Math.max(
        0,
        Math.round((aktualniVoda - 0.5) * 10) / 10
    );

    zobrazitZavazadla();

        return celkem + obsah.reduce((soucet, polozka) => {
            if (polozka.predmet !== "Cestovní porce trvanlivého jídla") {
                return soucet;
            }

            return soucet + (Number(polozka.pocet) || 1);

async function zmenitCestovniJidlo(smer) {

    const zavazadla = postava.inventar.zavazadla || [];
    const nazevJidla = "Cestovní porce trvanlivého jídla";

    if (smer < 0) {

        for (const zavazadlo of zavazadla) {

            if (zavazadlo.nedostupne) continue;

            const index = (zavazadlo.obsah || []).findIndex(
                p => p.predmet === nazevJidla
            );

            if (index === -1) continue;

            const polozka = zavazadlo.obsah[index];

            if ((Number(polozka.pocet) || 1) > 1) {
                polozka.pocet--;
            } else {
                zavazadlo.obsah.splice(index, 1);
            }

            zobrazitZavazadla();
            await ulozitInventar();
            return;
        }

        zobrazitHlasku(
            "V žádném dostupném zavazadle nemáš žádnou cestovní porci jídla.",
            "Žádné jídlo"
        );

        return;
    }

const zavazadloSJidlem = zavazadla.find(z =>
    !z.nedostupne &&
    (z.obsah || []).some(p => p.predmet === nazevJidla)
);

if (zavazadloSJidlem) {
    await pridatCestovniJidloDoZavazadla(zavazadloSJidlem.id);
    return;
}

    const moznosti = zavazadla.filter(
        z => !z.nedostupne && !jeVakNaVodu(z.predmet)
    );

    if (moznosti.length === 0) {
        zobrazitHlasku(
            "Nemáš žádné dostupné zavazadlo, do kterého by bylo možné jídlo uložit.",
            "Žádné dostupné zavazadlo"
        );
        return;
    }

    const nadpis = document.getElementById("vlastniOknoNadpis");
    const text = document.getElementById("vlastniOknoText");
    const tlacitka = document.getElementById("vlastniOknoTlacitka");
    const pozadi = document.getElementById("vlastniOknoPozadi");

    nadpis.textContent = "Přidat cestovní jídlo";
    text.textContent = "Vyber zavazadlo, do kterého chceš přidat jednu porci:";

    tlacitka.innerHTML = "";

    moznosti.forEach(zavazadlo => {

        const tlacitko = document.createElement("button");
        tlacitko.type = "button";
        tlacitko.textContent = zavazadlo.predmet;

        tlacitko.onclick = function() {
            pridatCestovniJidloDoZavazadla(zavazadlo.id);
        };

        tlacitka.appendChild(tlacitko);
    });

    const zrusit = document.createElement("button");
    zrusit.type = "button";
    zrusit.textContent = "Zrušit";

    zrusit.onclick = function() {
        pozadi.style.display = "none";
    };

    tlacitka.appendChild(zrusit);

    pozadi.style.display = "flex";
}


async function pridatCestovniJidloDoZavazadla(idZavazadla) {

    const zavazadlo = postava.inventar.zavazadla.find(
        z => z.id === idZavazadla
    );

    if (!zavazadlo || zavazadlo.nedostupne) {
        zobrazitHlasku(
            "Toto zavazadlo není dostupné.",
            "Nedostupné zavazadlo"
        );
        return;
    }

    const nazevJidla = "Cestovní porce trvanlivého jídla";
    const udaje = najitPredmetVCeniku(nazevJidla);

    if (!udaje) {
        zobrazitHlasku(
            "Cestovní porci trvanlivého jídla se nepodařilo najít v ceníku.",
            "Chyba"
        );
        return;
    }

    const velikost = Number(udaje.kbel) || 0;
    const obsah = zavazadlo.obsah || [];

    const obsazeno = obsah.reduce(
        (soucet, polozka) => {
            const velikostPolozky = jeVakNaVodu(polozka.predmet)
                ? mnozstviVodyVeVaku(polozka)
                : (Number(polozka.kbel) || 0) *
                  (Number(polozka.pocet) || 1);

            return soucet + velikostPolozky;
        },
        0
    );

    const kapacita = Number(zavazadlo.kapacita_kbel) || 0;

    if (obsazeno + velikost > kapacita + 0.000000001) {
        zobrazitHlasku(
            "Do tohoto zavazadla se další porce jídla nevejde.",
            "Nedostatek místa"
        );
        return;
    }

    zavazadlo.obsah = obsah;

    const existujici = obsah.find(
        p => p.predmet === nazevJidla
    );

    if (existujici) {
        existujici.pocet = (Number(existujici.pocet) || 1) + 1;
    } else {
        obsah.push({
            id: crypto.randomUUID(),
            predmet: nazevJidla,
            kbel: velikost,
            pocet: 1
        });
    }

    document.getElementById("vlastniOknoPozadi").style.display = "none";

    zobrazitZavazadla();
    await ulozitInventar();
}

function jeZavazadlo(nazev) {

    const zavazadla = cenikData.zavazadla || [];

    return zavazadla.some(
        zavazadlo => zavazadlo.nazev === nazev
    );
}

function zmenitDostupnostZavazadla(idZavazadla, nedostupne) {
    const zavazadlo = postava.inventar.zavazadla.find(

/* Změna množství peněz a jídla */

function zobrazitPenize(celkemMedaku) {

    if (celkemMedaku < 0) {
        celkemMedaku = 0;
    }

    const zlato = Math.floor(celkemMedaku / 100);
    const stribro = Math.floor((celkemMedaku % 100) / 10);
    const med = celkemMedaku % 10;

    document.getElementById("zlato").textContent = zlato;
    document.getElementById("stribro").textContent = stribro;
    document.getElementById("med").textContent = med;
}


function celkemPenezVMedacich() {

    const zlato =
        Number(document.getElementById("zlato").textContent) || 0;

    const stribro =
        Number(document.getElementById("stribro").textContent) || 0;

    const med =
        Number(document.getElementById("med").textContent) || 0;

    return zlato * 100 + stribro * 10 + med;
}


function zmenitPeneze(smer) {

    const castka =
        Number(document.getElementById("castkaPenez").value) || 0;

    const mena =
        document.getElementById("menaPenez").value;

    if (castka <= 0) {
        return;
    }

    let hodnotaVMediakach = 1;

    if (mena === "stribro") {
        hodnotaVMediakach = 10;
    }

    if (mena === "zlato") {
        hodnotaVMediakach = 100;
    }

    let celkem = celkemPenezVMedacich();

const zmena = smer * castka * hodnotaVMediakach;

if (celkem + zmena < 0) {

    zobrazitHlasku(
        "Postava nemá dostatek peněz.",
        "Peníze"
    );

    return;
}

celkem += zmena;

zobrazitPenize(celkem);
}
function zmenitMnozstvi(co, smer) {

    const prvek = document.getElementById(co);

    if (!prvek) {
        return;
    }

    let mnozstvi = Number(prvek.textContent) || 0;

    mnozstvi += smer;

    if (mnozstvi < 0) {
        mnozstvi = 0;
    }

    prvek.textContent = mnozstvi;
}

async function ulozitInventar() {

    if (!postava) {
        return;
    }

    if (!postava.inventar) {
        postava.inventar = {};
    }

    const celkemPenez = celkemPenezVMedacich();

    postava.inventar.penize = celkemPenez;
    postava.inventar.zlato = Math.floor(celkemPenez / 100);
    postava.inventar.stribro = Math.floor((celkemPenez % 100) / 10);
    postava.inventar.med = celkemPenez % 10;

    postava.inventar.jidlo = pocetCestovnihoJidla();

    if (!Array.isArray(postava.inventar.zavazadla)) {
        postava.inventar.zavazadla = [];
    }

    if (!Array.isArray(postava.inventar.predmety)) {
        postava.inventar.predmety = [];
    }

    const { error } = await supabaseClient
        .from("postavy")
        .update({
            data: postava
        })
        .eq("id", idPostavy);

    if (error) {
        console.error("Chyba při ukládání inventáře:", error);

        document.getElementById("ulozeno").textContent =
            "Uložení se nepodařilo.";

        return;
    }

    document.getElementById("ulozeno").textContent = "Uloženo.";

    setTimeout(function() {
        document.getElementById("ulozeno").textContent = "";
    }, 2000);
}

 function pridatZavazadlo(nazev, umisteni) {

    const zavazadla = postava.inventar.zavazadla;

    const maximum = umisteni === "zada" ? 1 : 4;

    const pocet = zavazadla.filter(
        z => z.umisteni === umisteni
    ).length;

    if (pocet >= maximum) {
        zobrazitHlasku(
            umisteni === "zada"
                ? "Na zádech už máš jedno zavazadlo."
                : "Na opasku můžeš mít maximálně čtyři zavazadla.",
            "Plné místo"
        );
        return;
    }

    const noveZavazadlo = vytvoritZavazadlo(nazev);

    if (!noveZavazadlo) {
        zobrazitHlasku(
            "Toto zavazadlo nebylo nalezeno v ceníku.",
            "Chyba"
        );
        return;
    }

    noveZavazadlo.umisteni = umisteni;

    zavazadla.push(noveZavazadlo);

    document.getElementById("vlastniOknoPozadi").style.display = "none";

    zobrazitZavazadla();

function vymenitZavazadlo(idZavazadla = null) {

    const stareZavazadlo = idZavazadla
        ? postava.inventar.zavazadla.find(z => z.id === idZavazadla)
        : postava.inventar.zavazadla.find(z => z.umisteni === "zada");

    if (!stareZavazadlo) {
        zobrazitHlasku(
            "Toto zavazadlo už není dostupné k výměně.",
            "Výměna zavazadla"
        );
        return;
    }

    const umisteni = stareZavazadlo.umisteni;

    const moznosti = (cenikData.zavazadla || [])
        .filter(z => z.umisteni === umisteni)
        .map(z => z.nazev)
        .sort((a, b) => a.localeCompare(b, "cs"));

    const tlacitka = document.getElementById("vlastniOknoTlacitka");

    document.getElementById("vlastniOknoNadpis").textContent =
        "Vyměnit zavazadlo";

    document.getElementById("vlastniOknoText").textContent =
        `Současné zavazadlo: ${stareZavazadlo.predmet}\nVyber nové zavazadlo:`;

    tlacitka.innerHTML = "";

    moznosti.forEach(nazev => {
        if (nazev === stareZavazadlo.predmet) return;

        const tlacitko = document.createElement("button");
        tlacitko.type = "button";
        tlacitko.textContent = nazev;

        tlacitko.onclick = function() {
            potvrditVymenuZavazadla(nazev, stareZavazadlo.id);
        };

        tlacitka.appendChild(tlacitko);
    });

    const zavrit = document.createElement("button");
    zavrit.type = "button";
    zavrit.textContent = "Zrušit";
    zavrit.onclick = function() {
        document.getElementById("vlastniOknoPozadi").style.display = "none";
    };

    tlacitka.appendChild(zavrit);

    document.getElementById("vlastniOknoPozadi").style.display = "flex";
}



async function potvrditVymenuZavazadla(nazev, idZavazadla = null) {

    const inventar = postava.inventar;
    const zavazadla = inventar.zavazadla;

    const index = idZavazadla
        ? zavazadla.findIndex(z => z.id === idZavazadla)
        : zavazadla.findIndex(z => z.umisteni === "zada");

    if (index === -1) {
        zobrazitHlasku(
            "Toto zavazadlo už není dostupné k výměně.",
            "Výměna zavazadla"
        );
        return;
    }

    const stareZavazadlo = zavazadla[index];
    const umisteni = stareZavazadlo.umisteni;

    const noveZavazadlo = vytvoritZavazadlo(nazev);

    if (!noveZavazadlo) {
        zobrazitHlasku(
            "Nové zavazadlo se nepodařilo vytvořit.",
            "Chyba"
        );
        return;
    }

    // Pokud byl aktivní vak ve starém zavazadle, zrušíme jeho výběr.
    const aktivniVak = najitVakyNaVodu().find(
        vak => vak.id === inventar.aktivniVakNaVodu
    );

    if (aktivniVak) {
        const stareObsahujeAktivniVak =
            stareZavazadlo.id === aktivniVak.id ||
            (stareZavazadlo.obsah || []).some(
                p => p.id === aktivniVak.id
            ) ||
            (stareZavazadlo.vnejsi_poutka || []).some(
                p => p?.id === aktivniVak.id
            );

        if (stareObsahujeAktivniVak) {
            inventar.aktivniVakNaVodu = null;
        }
    }

    if (!Array.isArray(inventar.odlozeneVeci)) {
        inventar.odlozeneVeci = [];
    }

    // Staré zavazadlo přesuneme celé, beze změny.
    inventar.odlozeneVeci.push(stareZavazadlo);
    zavazadla.splice(index, 1);

    // Nové zavazadlo umístíme na stejné místo.
    noveZavazadlo.umisteni = umisteni;
    zavazadla.push(noveZavazadlo);

    document.getElementById("vlastniOknoPozadi").style.display = "none";

    zobrazitZavazadla();
    await ulozitInventar();
}


function najitVsechnyPredmetyVCeniku() {

    const vysledky = [];

    function prohledat(objekt) {

        if (!objekt || typeof objekt !== "object") return;

        if (Array.isArray(objekt)) {
            objekt.forEach(polozka => {
                if (
                    polozka &&
                    typeof polozka === "object" &&
                    polozka.nazev
                ) {
                    vysledky.push(polozka);
                }

                prohledat(polozka);
            });
        } else {
            Object.values(objekt).forEach(prohledat);
        }
    }

    prohledat(cenikData);

    return vysledky;
}

function pridatPredmetDoZavazadla(idZavazadla, predmet) {

    const zavazadlo = postava.inventar.zavazadla.find(
        z => z.id === idZavazadla
    );

    if (!zavazadlo) return;
    

if (zavazadlo.nedostupne) {
    zobrazitHlasku(
        "Toto zavazadlo je nedostupné a nelze do něj přidávat předměty.",
        "Nedostupné zavazadlo"
    );
    return;
}
    const velikost = Number(predmet.kbel) || 0;
    const kapacita = Number(zavazadlo.kapacita_kbel) || 0;

    const obsah = Array.isArray(zavazadlo.obsah)
        ? zavazadlo.obsah
        : [];

const obsazeno = obsah.reduce(
    (soucet, polozka) => {
        const velikost = jeVakNaVodu(polozka.predmet)
            ? mnozstviVodyVeVaku(polozka)
            : (Number(polozka.kbel) || 0) * (Number(polozka.pocet) || 1);

        return soucet + velikost;
    },
    0
);

    if (obsazeno + velikost > kapacita + 0.000000001) {
        zobrazitHlasku(
            "Do tohoto zavazadla se předmět už nevejde.",
            "Nedostatek místa"
        );
        return;
    }

    zavazadlo.obsah = obsah;

 zavazadlo.obsah.push({
    id: crypto.randomUUID(),
    predmet: predmet.nazev,
    kbel: velikost,
    pocet: 1,
    ...(predmet.nazev.startsWith("Vak na vodu")
        ? { voda_litru: 0 }
        : {})
});

    document.getElementById("vlastniOknoPozadi").style.display = "none";

    zobrazitZavazadla();
}

function pridatKusPredmetu(idZavazadla, index) {

    const zavazadlo = postava.inventar.zavazadla.find(
        z => z.id === idZavazadla
    );

    if (!zavazadlo) return;
    
    if (zavazadlo.nedostupne) {
    zobrazitHlasku(
        "Toto zavazadlo je nedostupné a nelze měnit jeho obsah.",
        "Nedostupné zavazadlo"
    );
    return;
}

    const polozka = zavazadlo.obsah[index];

    if (!polozka) return;
    
    if (jeVakNaVodu(polozka.predmet)) {
    zobrazitHlasku(
        "Vaky na vodu se přidávají samostatně, aby měl každý vlastní množství vody.",
        "Samostatný vak"
    );
    return;
}

    const obsazeno = zavazadlo.obsah.reduce(
        (soucet, p) =>
            soucet +
            (Number(p.kbel) || 0) *
            (Number(p.pocet) || 1),
        0
    );

    const velikost = Number(polozka.kbel) || 0;
    const kapacita = Number(zavazadlo.kapacita_kbel) || 0;

    if (obsazeno + velikost > kapacita + 0.000000001) {
        zobrazitHlasku(
            "Do tohoto zavazadla se další kus už nevejde.",
            "Nedostatek místa"
        );
        return;
    }

    polozka.pocet = (Number(polozka.pocet) || 1) + 1;

    zobrazitZavazadla();
}
function odebratKusPredmetu(idZavazadla, index) {

    const zavazadlo = postava.inventar.zavazadla.find(
        z => z.id === idZavazadla
    );

    if (!zavazadlo) return;
    
    if (zavazadlo.nedostupne) {
    zobrazitHlasku(
        "Toto zavazadlo je nedostupné a nelze měnit jeho obsah.",
        "Nedostupné zavazadlo"
    );
    return;
}

    const polozka = zavazadlo.obsah[index];

    if (!polozka) return;

    const pocet = Number(polozka.pocet) || 1;

    if (pocet > 1) {
        polozka.pocet = pocet - 1;
    } else {
        zavazadlo.obsah.splice(index, 1);
    }

    zobrazitZavazadla();
}

function upravitPoznamkuVaku(idVaku) {

    const zavazadla = postava.inventar.zavazadla || [];

    let vak = null;
    let rodic = null;

    for (const zavazadlo of zavazadla) {

        if (zavazadlo.id === idVaku) {
            vak = zavazadlo;
            rodic = zavazadlo;
            break;
        }

        const uvnitr = (zavazadlo.obsah || []).find(
            predmet => predmet.id === idVaku
        );

        const naPoutku = (zavazadlo.vnejsi_poutka || []).find(
            predmet => predmet?.id === idVaku
        );

        if (uvnitr || naPoutku) {
            vak = uvnitr || naPoutku;
            rodic = zavazadlo;
            break;
        }
    }

    if (!vak) return;

    if (rodic.nedostupne) {
        zobrazitHlasku(
            "Toto zavazadlo je nedostupné a nelze upravovat jeho předměty.",
            "Nedostupné zavazadlo"
        );
        return;
    }

    const pozadi = document.getElementById("vlastniOknoPozadi");
    const nadpis = document.getElementById("vlastniOknoNadpis");
    const text = document.getElementById("vlastniOknoText");
    const tlacitka = document.getElementById("vlastniOknoTlacitka");

    nadpis.textContent = "Poznámka k vaku";
    text.textContent = vak.predmet;

    tlacitka.innerHTML = `
        <textarea
            id="poznamkaVakuInput"
            placeholder="Napiš poznámku k vaku..."
            style="
                width: 100%;
                min-height: 100px;
                box-sizing: border-box;
                padding: 10px;
                margin-bottom: 12px;
                background: rgba(0, 0, 0, 0.5);
                color: #eee4d2;
                border: 1px solid #8a704d;
                border-radius: 5px;
                font-family: Georgia, serif;
                font-size: 15px;
                resize: vertical;
            "
        >${escapovatHTML(vak.poznamka || "")}</textarea>

        <button type="button" id="ulozitPoznamkuVaku">
            Uložit poznámku
        </button>

        <button type="button" id="zrusitPoznamkuVaku">
            Zrušit
        </button>
    `;

    document.getElementById("ulozitPoznamkuVaku").onclick = function() {

        vak.poznamka = document
            .getElementById("poznamkaVakuInput")
            .value.trim();

        pozadi.style.display = "none";
        zobrazitZavazadla();
    };

    document.getElementById("zrusitPoznamkuVaku").onclick = function() {
        pozadi.style.display = "none";
    };

    pozadi.style.display = "flex";
}

function odebratSamostatnyVak(idVaku) {

    const zavazadla = postava.inventar.zavazadla || [];

    const index = zavazadla.findIndex(
        vak => vak.id === idVaku && jeVakNaVodu(vak.predmet)
    );

    if (index === -1) return;

    const vak = zavazadla[index];

    if (vak.nedostupne) {
        zobrazitHlasku(
            "Tento vak je nedostupný a nelze ho odstranit.",
            "Nedostupný vak"
        );
        return;
    }

    zavazadla.splice(index, 1);

    if (postava.inventar.aktivniVakNaVodu === idVaku) {
        postava.inventar.aktivniVakNaVodu = null;
    }

    zobrazitZavazadla();
}












function escapovatHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function nabidnoutVakNaPoutko(idZavazadla, indexPoutka) {

    const zavazadlo = postava.inventar.zavazadla.find(
        z => z.id === idZavazadla
    );

    if (!zavazadlo) return;

    if (zavazadlo.nedostupne) {
        zobrazitHlasku(
            "Toto zavazadlo je nedostupné a nelze na něj zavěšovat předměty.",
            "Nedostupné zavazadlo"
        );
        return;
    }

    const predmety = najitVsechnyPredmetyVCeniku()
        .filter(predmet =>
            predmet.zavesitelne === true ||
            predmet.zavesitelne === "true" ||
            predmet.zavesitelne === 1 ||
            predmet.zavesitelne === "1"
        )
        .sort((a, b) => a.nazev.localeCompare(b.nazev, "cs"));

    const tlacitka = document.getElementById("vlastniOknoTlacitka");
    const pozadi = document.getElementById("vlastniOknoPozadi");

    document.getElementById("vlastniOknoNadpis").textContent =
        "Zavěsit předmět";

    document.getElementById("vlastniOknoText").textContent =
        predmety.length
            ? "Vyber předmět, který chceš zavěsit:"
            : "V ceníku nejsou žádné předměty označené jako zavěsitelné.";

    tlacitka.innerHTML = "";

    predmety.forEach(predmet => {

        const tlacitko = document.createElement("button");

        tlacitko.type = "button";
        tlacitko.textContent = predmet.nazev;

        tlacitko.onclick = function() {
            zavesitVakNaPoutko(
                idZavazadla,
                indexPoutka,
                predmet.nazev
            );
        };

        tlacitka.appendChild(tlacitko);
    });

    const zavrit = document.createElement("button");
    zavrit.type = "button";
    zavrit.textContent = "Zrušit";

    zavrit.onclick = function() {
        pozadi.style.display = "none";
    };

    tlacitka.appendChild(zavrit);

    pozadi.style.display = "flex";
}
function zavesitVakNaPoutko(idZavazadla, indexPoutka, nazev) {
    const zavazadlo = postava.inventar.zavazadla.find(
        z => z.id === idZavazadla
    );

    if (!zavazadlo) return;
    
    if (zavazadlo.nedostupne) {
    zobrazitHlasku(
        "Toto zavazadlo je nedostupné a nelze na něj zavěšovat předměty.",
        "Nedostupné zavazadlo"
    );
    return;
}

    const pocetPoutek = Number(zavazadlo.pocet_poutek) || 0;

    if (indexPoutka < 0 || indexPoutka >= pocetPoutek) return;

    if (!Array.isArray(zavazadlo.vnejsi_poutka)) {
        zavazadlo.vnejsi_poutka = [];
    }

    if (zavazadlo.vnejsi_poutka[indexPoutka]) {
        zobrazitHlasku("Toto poutko už je obsazené.", "Obsazené poutko");
        return;
    }

    const udaje = najitPredmetVCeniku(nazev);

   if (
    !udaje ||
    !(
        udaje.zavesitelne === true ||
        udaje.zavesitelne === "true" ||
        udaje.zavesitelne === 1 ||
        udaje.zavesitelne === "1"
    )
) {
    zobrazitHlasku(
        "Tento předmět není určený k zavěšení.",
        "Nelze zavěsit"
    );
    return;
}

zavazadlo.vnejsi_poutka[indexPoutka] = {
    id: crypto.randomUUID(),
    predmet: nazev,
    ...(jeVakNaVodu(nazev) ? { voda_litru: 0 } : {})
};

    document.getElementById("vlastniOknoPozadi").style.display = "none";

    zobrazitZavazadla();
}

function odebratVakZPoutka(idZavazadla, index) {

    const zavazadlo = (postava.inventar.zavazadla || []).find(
        z => z.id === idZavazadla
    );

    if (!zavazadlo) return;

    if (zavazadlo.nedostupne) {
        zobrazitHlasku(
            "Toto zavazadlo je nedostupné a nelze upravovat jeho předměty.",
            "Nedostupné zavazadlo"
        );
        return;
    }

    const predmet = zavazadlo.vnejsi_poutka?.[index];

    if (!predmet) return;

    zavazadlo.vnejsi_poutka.splice(index, 1);

    if (
        jeVakNaVodu(predmet.predmet) &&
        postava.inventar.aktivniVakNaVodu === predmet.id
    ) {
        postava.inventar.aktivniVakNaVodu = null;
    }

    zobrazitZavazadla();
}
