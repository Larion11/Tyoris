
<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Svět a království</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {

    background:
        radial-gradient(
            circle at center,
            #25201a 0%,
            #100e0c 65%,
            #080706 100%
        );

    color: #e8dfcf;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    padding: 40px 20px;
}


/* Hlavní stránka */

.page {

    width: min(1240px, 96vw);

    margin: 0 auto;

    padding: 35px 55px 45px;

    border: 2px solid #6f5a3e;

    box-shadow:
        0 0 40px rgba(0,0,0,.75),
        inset 0 0 50px rgba(0,0,0,.4);

    background: rgba(18,15,12,.88);
}


/* Záložky */


/* Záložky */

.zalozky {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 35px;
    border-bottom: 1px solid #6f5a3e;
    padding-bottom: 10px;
    flex-wrap: wrap;
}

.zalozka {
    padding: 17px 34px;
    font-family: inherit;
    font-size: 18px;
    color: #eee4d2;
    background: linear-gradient(
        180deg,
        #403222 0%,
        #241b13 100%
    );
    border: 1px solid #8a704d;
    border-radius: 4px;
    cursor: pointer;
    box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 230, 180, 0.08);
    transition: background 0.2s, border-color 0.2s;
}

.zalozka:hover {
    background: linear-gradient(
        180deg,
        #51402b 0%,
        #332519 100%
    );
    border-color: #b39468;
}

.zalozka.aktivni {
    background: linear-gradient(
        180deg,
        #5a452e 0%,
        #35271a 100%
    );
    border-color: #c4a477;
    color: #fff0d5;
}



/* Obsah záložky */

.obsah-zalozky {

    min-height: 500px;
}


/* Nadpis */

h1 {

    margin: 0 0 45px;

    text-align: center;

    font-size: clamp(36px, 6vw, 60px);

    font-weight: normal;

    letter-spacing: 2px;

    text-shadow:
        0 3px 8px #000;
}


/* Nadpis části */

h2 {

    margin: 35px 0 25px;

    padding-bottom: 8px;

    border-bottom: 1px solid #6f5a3e;

    font-size: 28px;

    font-weight: normal;

    color: #d6c19e;
}


/* Jednotlivá pravidla */

.pravidlo {

    margin-bottom: 28px;

    font-size: 19px;

    line-height: 1.6;
}


.pravidlo-cislo {

    font-size: 22px;

    color: #d6c19e;

    margin-bottom: 8px;
}


/* Odrážky */

ul {

    margin-top: 8px;

    padding-left: 28px;
}


li {

    margin-bottom: 7px;
}


/* Zvýraznění */

.zvyrazneni {

    color: #d6c19e;

}


/* Tlačítko */

.zpet {

    display: block;

    margin: 45px auto 0;

    padding: 14px 28px;

    font: inherit;

    font-size: 19px;

    color: #eee4d2;

    background: #33291e;

    border: 1px solid #8a704d;

    cursor: pointer;

    box-shadow:
        0 4px 12px rgba(0,0,0,.5);
}


.zpet:hover {

    background: #473827;

    border-color: #b39468;
}


/* Mobil */

@media (max-width: 600px) {

    body {
        padding: 20px 10px;
    }

    .page {
        padding: 25px 22px 30px;
    }

    .zalozka {
        font-size: 16px;
        padding: 10px 16px;
    }

    .pravidlo {
        font-size: 17px;
    }

}

</style>

</head>


<body>

<main class="page">

<h1>Svět a království</h1>

    <!-- ZÁLOŽKY -->

    <nav class="zalozky">

   <button class="zalozka aktivni" onclick="zobrazZalozku('svet')">
    Svět
</button>

<button class="zalozka" onclick="zobrazZalozku('lutavske')">
    Lutavské království
</button>     
     
    </nav>


    <!-- SVĚT -->

    <section id="svet" class="obsah-zalozky" style="display:block;">
    <h2>Svět</h2>

    <div class="pravidlo">
        <p>Zde bude obecný popis světa, jeho historie, uspořádání a dalších důležitých informací.</p>
    </div>
</section>

<section id="lutavske" class="obsah-zalozky" style="display:none;">
    

    <iframe
        src="tyoris/lutavske_kralovstvi.html"
        style="width:100%; height:750px; border:none; border-radius:8px;"
        title="Lutavské království">
    </iframe>
</section>


    
    <button
        class="zpet"
        type="button"
        onclick="window.close()"
    >
        Zavřít
    </button>


</main>


<script>

function zobrazZalozku(zalozka) {
    document.querySelectorAll('.obsah-zalozky').forEach(section => {
        section.style.display = 'none';
    });

    document.querySelectorAll('.zalozka').forEach(button => {
        button.classList.remove('aktivni');
    });

    document.getElementById(zalozka).style.display = 'block';

    const tlacitka = document.querySelectorAll('.zalozka');

    if (zalozka === 'svet') {
        tlacitka[0].classList.add('aktivni');
    } else if (zalozka === 'lutavske') {
        tlacitka[1].classList.add('aktivni');
    }
}



</script>


</body>

</html>
