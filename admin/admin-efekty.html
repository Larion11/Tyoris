
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Správa efektů</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    background-image: url("../pozadi.jpg");
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
    color: #eee4d2;
    font-family: Georgia, serif;
}

.page {
    width: min(1100px, 94vw);
    margin: 35px auto;
    padding: 30px;
    background: rgba(20, 17, 14, 0.94);
    border: 2px solid #6f5a3e;
    box-shadow: 0 0 25px #000;
}

h1, h2 { color: #d8c29d; }
h1 { text-align: center; }
h2 { margin-top: 30px; }

button {
    padding: 9px 15px;
    margin: 4px;
    background: #33291e;
    color: #eee4d2;
    border: 1px solid #8a704d;
    border-radius: 4px;
    cursor: pointer;
    font-family: Georgia, serif;
}

button:hover {
    background: #473827;
    border-color: #b39468;
}

button:disabled { opacity: .5; cursor: not-allowed; }

input, select, textarea {
    width: 100%;
    padding: 9px;
    background: #211b15;
    color: #eee4d2;
    border: 1px solid #6f5a3e;
    border-radius: 4px;
    font-family: Georgia, serif;
}

textarea { min-height: 75px; resize: vertical; }

label {
    display: block;
    margin: 12px 0 5px;
    color: #d8c29d;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 18px;
}

.actions { margin-top: 18px; }

#zprava {
    margin: 15px 0;
    padding: 10px;
    white-space: pre-wrap;
}

#zprava:empty { display: none; }
.chyba { color: #ffaaaa; }
.uspech { color: #c4e4a8; }
#stavPrihlaseni { text-align: center; color: #d8c29d; }

.table-wrap { overflow-x: auto; margin-top: 15px; }

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 10px;
    border: 1px solid #6f5a3e;
    text-align: left;
}

th { background: #33291e; color: #d8c29d; }
tr:nth-child(even) { background: rgba(70, 55, 39, .25); }

.ucinek {
    border: 1px solid #6f5a3e;
    padding: 12px;
    margin-top: 12px;
    background: rgba(40, 31, 22, .6);
}


.ucinek-grid {
    display: grid;
    grid-template-columns: 1.2fr 1.2fr .7fr auto;
    gap: 10px;
    align-items: end;
}


.ucinek label { margin-top: 4px; }

#obsah > .actions:last-child {
    text-align: center;
    margin-top: 25px;
}

@media (max-width: 700px) {
    .page { padding: 15px; }
    .form-grid, .ucinek-grid { grid-template-columns: 1fr; }
}

/* Potvrzovací okno */
.modal-pozadi {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
}

.modal-pozadi[hidden] { display: none; }

.modal-okno {
    width: min(420px, 100%);
    padding: 25px;
    text-align: center;
    background: #14110e;
    border: 2px solid #6f5a3e;
    box-shadow: 0 0 25px #000;
}

.modal-okno h2 { margin-top: 0; }
.modal-okno p { line-height: 1.6; overflow-wrap: anywhere; }
.modal-akce { margin-top: 20px; }
.modal-akce .potvrdit { background: #54251f; border-color: #a65c4e; }
.modal-akce .zrusit { background: #33291e; }
</style>
</head>

<body>
<div class="page">
    <h1>Správa efektů</h1>

    <p id="stavPrihlaseni">Ověřuji přihlášení...</p>
    <div id="zprava" role="status"></div>

    <div id="obsah" hidden>
        <h2 id="nadpisFormulare">Přidat efekt</h2>

        <form id="formular">
            <input type="hidden" id="id">

            <div class="form-grid">
                <div>
                    <label for="nazev">Název efektu</label>
                    <input id="nazev" maxlength="150" required>
                </div>

                <div>
                    <label for="typ">Typ efektu</label>
                    <select id="typ" required>
                        <option value="">-- Vyber typ --</option>
                        <option value="Nemoc">Nemoc</option>
                        <option value="Status">Status</option>
                        <option value="Alchymie">Alchymie</option>
                    </select>
                </div>

            </div>

            <h2>Účinky</h2>
            <p>Každý řádek představuje jednu změnu vlastnosti nebo schopnosti. U nemocí vyplň fázi.</p>

            <div id="ucinky"></div>

            <button type="button" id="pridatUcinek">Přidat účinek</button>

            <div class="actions">
                <button type="submit" id="ulozit">Přidat efekt</button>
                <button type="button" id="zrusit" hidden>Zrušit úpravu</button>
            </div>
        </form>

        <h2>Seznam efektů</h2>
        <button type="button" id="obnovit">Obnovit seznam</button>

        <div class="table-wrap">
            <table>
                <thead>
    <tr>
        <th>Název</th>
        <th>Typ</th>
        <th>Účinky</th>
    </tr>
</thead>
                <tbody id="seznam">
                    <tr><td colspan="4">Načítám efekty...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="actions">
            <button type="button" id="zpet">Zpět do administrace</button>
        </div>
    </div>
</div>

<div id="modalPozadi" class="modal-pozadi" hidden>
    <div class="modal-okno" role="dialog" aria-modal="true" aria-labelledby="modalNadpis">
        <h2 id="modalNadpis">Potvrzení</h2>
        <p id="modalText"></p>
        <div class="modal-akce">
            <button type="button" id="modalPotvrdit" class="potvrdit">Potvrdit</button>
            <button type="button" id="modalZrusit" class="zrusit">Zrušit</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xahjqqyjaxbhdmairkfr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OBIbH7JzU_A96jXlht_2FA_Yadsooqu";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const zprava = document.getElementById("zprava");
const obsah = document.getElementById("obsah");
const seznam = document.getElementById("seznam");
const formular = document.getElementById("formular");
const ucinky = document.getElementById("ucinky");

const modalPozadi = document.getElementById("modalPozadi");
const modalNadpis = document.getElementById("modalNadpis");
const modalText = document.getElementById("modalText");
const modalPotvrdit = document.getElementById("modalPotvrdit");
const modalZrusit = document.getElementById("modalZrusit");

function zobrazZpravu(text, chyba = false) {
    zprava.textContent = text;
    zprava.className = chyba ? "chyba" : "uspech";
}

function chybaDatabaze(chyba) {
    console.error(chyba);
    zobrazZpravu("Operace se nepodařila: " + (chyba.message || "Neznámá chyba."), true);
}

function potvrzovaciOkno(nadpis, text) {
    return new Promise((resolve) => {
        modalNadpis.textContent = nadpis;
        modalText.textContent = text;
        modalPozadi.hidden = false;

        function uklidit(vysledek) {
            modalPozadi.hidden = true;
            modalPotvrdit.removeEventListener("click", potvrdit);
            modalZrusit.removeEventListener("click", zrusit);
            modalPozadi.removeEventListener("click", klikMimo);
            document.removeEventListener("keydown", klavesa);
            resolve(vysledek);
        }

        function potvrdit() { uklidit(true); }
        function zrusit() { uklidit(false); }

        function klikMimo(event) {
            if (event.target === modalPozadi) zrusit();
        }

        function klavesa(event) {
            if (event.key === "Escape") zrusit();
        }

        modalPotvrdit.addEventListener("click", potvrdit);
        modalZrusit.addEventListener("click", zrusit);
        modalPozadi.addEventListener("click", klikMimo);
        document.addEventListener("keydown", klavesa);
    });
}

async function overitAdmina() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();

    if (error) {
        document.getElementById("stavPrihlaseni").textContent = "Nepodařilo se ověřit přihlášení.";
        zobrazZpravu(error.message, true);
        return;
    }

    if (!session) {
        document.getElementById("stavPrihlaseni").textContent =
            "Nejsi přihlášen. Přihlas se do hry a stránku znovu otevři.";
        return;
    }

    const { data: admin, error: adminChyba } = await supabaseClient
        .from("admini")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

    if (adminChyba) {
        document.getElementById("stavPrihlaseni").textContent =
            "Nepodařilo se ověřit administrátorská práva.";
        zobrazZpravu(adminChyba.message, true);
        return;
    }

    if (!admin) {
        document.getElementById("stavPrihlaseni").textContent =
            "Tento účet nemá administrátorská práva.";
        return;
    }

    document.getElementById("stavPrihlaseni").textContent = "Přihlášený administrátor";
    obsah.hidden = false;
    await nacistEfekty();
}

function pridatRadekUcinku(data = {}) {
    const radek = document.createElement("div");
    radek.className = "ucinek";

    const grid = document.createElement("div");
    grid.className = "ucinek-grid";

    function vytvorPole(popisek, typPole, hodnota, moznosti = null) {
        const obal = document.createElement("div");
        const label = document.createElement("label");
        label.textContent = popisek;

        let pole;

        if (moznosti) {
            pole = document.createElement("select");
            for (const moznost of moznosti) {
                const option = document.createElement("option");
                option.value = moznost.value;
                option.textContent = moznost.text;
                pole.appendChild(option);
            }
        } else {
            pole = document.createElement("input");
            pole.type = typPole;
        }

        pole.value = hodnota ?? "";
        obal.append(label, pole);
        grid.appendChild(obal);
        return pole;
    }

    const faze = vytvorPole("Fáze", "text", data.faze ?? "", [
        { value: "", text: "Bez fáze" },
        { value: "Začátek", text: "Začátek" },
        { value: "Zhoršení 1", text: "Zhoršení 1" },
        { value: "Zhoršení 2", text: "Zhoršení 2" },
        { value: "Konec", text: "Konec" }
    ]);

    const typ = vytvorPole("Vlastnost / schopnost", "text", data.typ ?? "", [
        { value: "", text: "-- Vyber --" },
        ...[
            "Síla", "Odolnost", "Hbitost", "Zručnost", "Moudrost",
            "Charisma", "Intuice", "Životy", "Atletika", "Akrobacie",
            "Břemena", "Výdrž", "Všímavost", "Přetvářka", "Odolnost nemoce"
        ].map(x => ({ value: x, text: x }))
    ]);


    const hodnota = vytvorPole("Změna", "number", data.hodnota ?? 0);
    hodnota.step = "1";


    const akce = document.createElement("div");
    const odebrat = document.createElement("button");
    odebrat.type = "button";
    odebrat.textContent = "Odebrat";
    odebrat.addEventListener("click", () => radek.remove());
    akce.appendChild(odebrat);
    grid.appendChild(akce);

    

    radek.appendChild(grid);
    ucinky.appendChild(radek);

        return { faze, typ, hodnota };
}

function vycistitUcinky() {
    ucinky.replaceChildren();
}


function ziskejUcinkyZFormulare() {
    const vysledek = [];

    for (const radek of ucinky.querySelectorAll(".ucinek")) {
        const faze = radek.querySelectorAll("select")[0].value.trim();
        const typ = radek.querySelectorAll("select")[1].value.trim();
        const pole = radek.querySelectorAll("input");
        const hodnotaText = pole[0].value.trim();
        

        if (!typ || hodnotaText === "") {
            throw new Error("Každý účinek musí mít vybranou vlastnost a vyplněnou změnu.");
        }

        const hodnota = Number(hodnotaText);

        if (!Number.isFinite(hodnota)) {
            throw new Error("Změna účinku musí být číslo.");
        }

        vysledek.push({
            faze: faze || null,
            typ,
            hodnota,
            
        });
    }

    return vysledek;
}



async function nacistEfekty() {
    seznam.innerHTML = '<tr><td colspan="5">Načítám efekty...</td></tr>';

    const { data, error } = await supabaseClient
        .from("efekty")
        .select("id, nazev, typ, aktivni")
        .order("id", { ascending: true });

    if (error) {
        seznam.innerHTML = '<tr><td colspan="5">Efekty se nepodařilo načíst.</td></tr>';
        chybaDatabaze(error);
        return;
    }

    seznam.replaceChildren();

    if (!data || data.length === 0) {
        const tr = document.createElement("tr");
        const td = document.createElement("td");
        td.colSpan = 5;
        td.textContent = "Zatím tu nejsou žádné efekty.";
        tr.appendChild(td);
        seznam.appendChild(tr);
        return;
    }

    // Načtení účinků všech efektů
    const { data: ucinkyData, error: ucinkyChyba } = await supabaseClient
        .from("efekty_ucinky")
        .select("efekt_id, typ, hodnota, faze")
        .in("efekt_id", data.map(efekt => efekt.id))
        .order("id", { ascending: true });

    if (ucinkyChyba) {
        chybaDatabaze(ucinkyChyba);
        return;
    }

    for (const efekt of data) {
        const tr = document.createElement("tr");

      for (const hodnota of [
    efekt.nazev,
    efekt.typ
]) {
            const td = document.createElement("td");
            td.textContent = hodnota ?? "";
            tr.appendChild(td);
        }

        // Sloupec účinků
        const tdUcinky = document.createElement("td");
        const ucinkyEfektu = (ucinkyData ?? [])
            .filter(u => String(u.efekt_id) === String(efekt.id));

        if (ucinkyEfektu.length === 0) {
            tdUcinky.textContent = "Bez účinků";
        } else {
            const seznamUcinku = document.createElement("ul");
            seznamUcinku.style.margin = "0";
            seznamUcinku.style.paddingLeft = "20px";

            for (const u of ucinkyEfektu) {
                const polozka = document.createElement("li");

                let text = `${u.typ} ${u.hodnota > 0 ? "+" : ""}${u.hodnota}`;

                if (u.faze) {
                    text = `${u.faze}: ${text}`;
                }

                polozka.textContent = text;
                seznamUcinku.appendChild(polozka);
            }

            tdUcinky.appendChild(seznamUcinku);
        }

        tr.appendChild(tdUcinky);

        const akce = document.createElement("td");

        const upravit = document.createElement("button");
        upravit.type = "button";
        upravit.textContent = "Upravit";
        upravit.addEventListener("click", () => upravitEfekt(efekt));

        const smazat = document.createElement("button");
        smazat.type = "button";
        smazat.textContent = "Smazat";
        smazat.addEventListener("click", () => smazatEfekt(efekt));

        akce.append(upravit, smazat);
        tr.appendChild(akce);
        seznam.appendChild(tr);
    }
}


async function upravitEfekt(efekt) {
    const { data, error } = await supabaseClient
        .from("efekty_ucinky")
        .select("id, efekt_id, typ, hodnota, faze")
        .eq("efekt_id", efekt.id)
        .order("id", { ascending: true });

    if (error) {
        chybaDatabaze(error);
        return;
    }

    document.getElementById("id").value = efekt.id;
    document.getElementById("nazev").value = efekt.nazev ?? "";
    document.getElementById("typ").value = efekt.typ ?? "";
    
    

    vycistitUcinky();
    for (const ucinek of data ?? []) pridatRadekUcinku(ucinek);
    if (!data || data.length === 0) pridatRadekUcinku();

    document.getElementById("nadpisFormulare").textContent = "Upravit efekt";
    document.getElementById("ulozit").textContent = "Uložit změny";
    document.getElementById("zrusit").hidden = false;
    formular.scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetFormulare() {
    formular.reset();
    document.getElementById("id").value = "";
    
    document.getElementById("nadpisFormulare").textContent = "Přidat efekt";
    document.getElementById("ulozit").textContent = "Přidat efekt";
    document.getElementById("zrusit").hidden = true;
    vycistitUcinky();
    pridatRadekUcinku();
}

formular.addEventListener("submit", async (event) => {
    event.preventDefault();

    const id = document.getElementById("id").value;
  const efekt = {
    nazev: document.getElementById("nazev").value.trim(),
    typ: document.getElementById("typ").value,
    
};

    if (!efekt.nazev || !efekt.typ) {
        zobrazZpravu("Vyplň název a typ efektu.", true);
        return;
    }

    let seznamUcinku;
    try {
        seznamUcinku = ziskejUcinkyZFormulare();
    } catch (error) {
        zobrazZpravu(error.message, true);
        return;
    }

    const tlacitko = document.getElementById("ulozit");
    tlacitko.disabled = true;

    try {
        let efektId = id;

        if (id) {
            const { error } = await supabaseClient.from("efekty").update(efekt).eq("id", id);
            if (error) throw error;

            const { error: smazaniChyba } = await supabaseClient
                .from("efekty_ucinky").delete().eq("efekt_id", id);
            if (smazaniChyba) throw smazaniChyba;
        } else {
            const { data, error } = await supabaseClient
                .from("efekty").insert([efekt]).select("id").single();
            if (error) throw error;
            efektId = data.id;
        }

        if (seznamUcinku.length > 0) {
            const radky = seznamUcinku.map(u => ({
                efekt_id: efektId,
                typ: u.typ,
                hodnota: u.hodnota,
                
                
                faze: u.faze
            }));

            const { error } = await supabaseClient.from("efekty_ucinky").insert(radky);
            if (error) throw error;
        }

        resetFormulare();
        zobrazZpravu(id ? "Efekt byl upraven." : "Efekt byl přidán.");
        await nacistEfekty();
    } catch (error) {
        chybaDatabaze(error);
    } finally {
        tlacitko.disabled = false;
    }
});

async function smazatEfekt(efekt) {
    const potvrzeno = await potvrzovaciOkno(
        "Smazat efekt",
        `Opravdu chceš smazat efekt „${efekt.nazev}“?`
    );

    if (!potvrzeno) return;

    const { error } = await supabaseClient.from("efekty").delete().eq("id", efekt.id);

    if (error) {
        chybaDatabaze(error);
        return;
    }

    zobrazZpravu("Efekt byl smazán.");
    await nacistEfekty();
}

document.getElementById("pridatUcinek").addEventListener("click", () => pridatRadekUcinku());
document.getElementById("zrusit").addEventListener("click", resetFormulare);
document.getElementById("obnovit").addEventListener("click", nacistEfekty);
document.getElementById("zpet").addEventListener("click", () => {
    location.href = "admin.html";
});

resetFormulare();
overitAdmina();
</script>
</body>
</html>
