
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zprávy</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;

   background-image: url("pozadi-zpravy.jpg");
background-position: center center;
background-size: cover;
background-attachment: fixed;

    color: #e8dfcf;

    font-family: Georgia, "Times New Roman", serif;

    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 0;
}

.page {
    width: min(900px, 90vw);
    min-height: 600px;

    border: 2px solid #6f5a3e;

    box-shadow:
        0 0 40px rgba(0,0,0,.75),
        inset 0 0 50px rgba(0,0,0,.4);

    background: rgba(18,15,12,.88);

    padding: 35px;
}

h1 {
    margin: 0 0 35px;
    text-align: center;

    font-size: clamp(38px, 6vw, 60px);
    font-weight: normal;

    letter-spacing: 2px;
    text-shadow: 0 3px 8px #000;
}

button {
    padding: 17px 34px;
    font-family: inherit;
    font-size: 19px;
    color: #eee4d2;
    background: linear-gradient(
        180deg,
        #403222 0%,
        #241b13 100%
    );
    border: 1px solid #8a704d;
    border-radius: 4px;
    cursor: pointer;
    box-shadow:
        0 3px 8px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 230, 180, 0.08);
    transition: background 0.2s, border-color 0.2s;
}

button:hover {
    background: #473827;
    border-color: #b39468;
}

.vlastni-okno-pozadi {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .75);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 9998;
}

.vlastni-okno {
    width: min(450px, 100%);
    padding: 25px;
    background: rgba(18, 15, 12, .98);
    border: 2px solid #6f5a3e;
    box-shadow:
        0 0 40px rgba(0, 0, 0, .85),
        inset 0 0 25px rgba(0, 0, 0, .4);
    color: #e8dfcf;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    text-align: center;
}

.vlastni-okno-tlacitka {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 25px;
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xahjqqyjaxbhdmairkfr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OBIbH7JzU_A96jXlht_2FA_Yadsooqu";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>

</head>

<body>

<main class="page">

    <h1>Zprávy</h1>


<div style="text-align: center; margin-bottom: 30px;">



    <button type="button" onclick="zobrazitDorucene()">
        Doručené
    </button>

    <button type="button" onclick="novaZprava()">
        Napsat zprávu
    </button>
    
    <button type="button" onclick="window.close()">
    Zavřít
</button>

</div>

<div id="obsahZprav"></div>
<script>
async function zobrazitDorucene() {
    const postavaId = new URLSearchParams(
        window.location.search
    ).get("id");

    if (!postavaId) {
        document.getElementById("obsahZprav").innerHTML =
            "<p>Chybí ID postavy. Otevři zprávy z archu postavy.</p>";
        return;
    }
    const obsah = document.getElementById("obsahZprav");

    const { data: { user } } =
        await supabaseClient.auth.getUser();

    if (!user) {
        obsah.innerHTML = "<p>Nejsi přihlášený.</p>";
        return;
    }

   const { data: zpravy, error } =
    await supabaseClient
        .from("zpravy")
        .select("*")
        .eq("prijemce_postava_id", Number(postavaId))
        .order("odeslano", { ascending: false });

if (error) {
    console.error("Chyba při načítání zpráv:", error);
    obsah.innerHTML = "<p>Zprávy se nepodařilo načíst.</p>";
    return;
}

const odesilatele = [...new Set(
    zpravy
        .map(zprava => zprava.odesilatel_postava_id)
        .filter(id => id !== null)
)];

let jmenaOdesilatelu = {};

if (odesilatele.length > 0) {
    const { data: postavy, error: chybaPostav } =
        await supabaseClient
            .from("verejne_postavy")
            .select("id, jmeno")
            .in("id", odesilatele);

    if (!chybaPostav && postavy) {
        postavy.forEach(function(postava) {
            jmenaOdesilatelu[postava.id] = postava.jmeno;
        });
    }
}

obsah.innerHTML = "";

if (zpravy.length === 0) {
    obsah.innerHTML = "<p>Nemáš žádné zprávy.</p>";

    if (window.opener && !window.opener.closed) {
        window.opener.zkontrolovatNoveZpravy();
    }

    return;
}

for (const zprava of zpravy) {
if (!zprava.precteno) {
    const { error: chybaPrecteni } = await supabaseClient
        .from("zpravy")
        .update({ precteno: true })
        .eq("id", zprava.id)
        .eq("prijemce_postava_id", Number(postavaId));

    if (chybaPrecteni) {
        console.error(
            "Chyba při označení zprávy jako přečtené:",
            chybaPrecteni
        );
    }

}

    const radek = document.createElement("div");

    radek.style.border = "1px solid #6f5a3e";
    radek.style.padding = "15px";
    radek.style.marginBottom = "12px";
    radek.style.background = "rgba(20,16,12,.7)";

radek.innerHTML =
   "<strong>" +
(zprava.predmet || "(bez předmětu)") +
"</strong><br>" +
"<small style='color:#c5a878;'>Od: " +
(jmenaOdesilatelu[zprava.odesilatel_postava_id] || "Neznámý odesílatel") +
"</small><br>" +
"<small style='color:#b9a68b;'>" +
(zprava.odeslano
    ? new Date(zprava.odeslano).toLocaleString("cs-CZ", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    })
    : "Datum není k dispozici") +
"</small><br><br>" +
"<span>" +
(zprava.text || "") +
"</span>";
const tlacitkoSmazat = document.createElement("button");

tlacitkoSmazat.type = "button";
tlacitkoSmazat.textContent = "Smazat";
tlacitkoSmazat.style.marginTop = "15px";
tlacitkoSmazat.style.padding = "6px 12px";
tlacitkoSmazat.style.fontSize = "15px";

tlacitkoSmazat.onclick = function() {
    smazatZpravu(zprava.id);
};

const obsahRadku = document.createElement("div");

obsahRadku.style.display = "flex";
obsahRadku.style.justifyContent = "space-between";
obsahRadku.style.alignItems = "center";
obsahRadku.style.gap = "20px";

const textZpravy = document.createElement("div");
textZpravy.style.flex = "1";
textZpravy.style.minWidth = "0";

// Přesuneme dosavadní obsah zprávy do levé části.
textZpravy.innerHTML = radek.innerHTML;
radek.innerHTML = "";

obsahRadku.appendChild(textZpravy);

tlacitkoSmazat.style.marginTop = "0";
tlacitkoSmazat.style.flexShrink = "0";

obsahRadku.appendChild(tlacitkoSmazat);
radek.appendChild(obsahRadku);
       obsah.appendChild(radek);
}
if (window.opener && !window.opener.closed) {
    window.opener.zkontrolovatNoveZpravy();
}
}


async function novaZprava() {

    const obsah = document.getElementById("obsahZprav");

    const { data: { user } } =
        await supabaseClient.auth.getUser();

    if (!user) {
        obsah.innerHTML = "<p>Nejsi přihlášený.</p>";
        return;
    }

   const { data: postavy, error } =
    await supabaseClient
        .from("verejne_postavy")
        .select("id, jmeno, user_id")
        .order("jmeno");

    if (error) {
        console.error("Chyba při načítání postav:", error);
        obsah.innerHTML = "<p>Nepodařilo se načíst seznam postav.</p>";
        return;
    }

    let moznosti = "";

    postavy.forEach(function(postava) {
       moznosti +=
    `<option value="${postava.id}" data-user-id="${postava.user_id}">${postava.jmeno}</option>`;
    });

    obsah.innerHTML = `
        <div style="
            border: 1px solid #6f5a3e;
            padding: 20px;
            background: rgba(20,16,12,.7);
        ">

            <label>Příjemce:</label><br>

            <select id="prijemceZpravy" style="
                width: 100%;
                padding: 10px;
                margin: 8px 0 15px;
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 17px;
                background: #33291e;
                color: #eee4d2;
                border: 1px solid #8a704d;
            ">
                <option value="">-- vyber postavu --</option>
                ${moznosti}
            </select>

            <label>Předmět:</label><br>

            <input id="predmetZpravy" type="text" style="
                width: 100%;
                padding: 10px;
                margin: 8px 0 15px;
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 17px;
                background: #33291e;
                color: #eee4d2;
                border: 1px solid #8a704d;
            ">

            <label>Zpráva:</label><br>

            <textarea id="textZpravy" rows="8" style="
                width: 100%;
                padding: 10px;
                margin: 8px 0 15px;
                font-family: Georgia, 'Times New Roman', serif;
                font-size: 17px;
                background: #33291e;
                color: #eee4d2;
                border: 1px solid #8a704d;
                resize: vertical;
            "></textarea>

            <div style="text-align: center;">
                <button type="button" onclick="odeslatZpravu()">
                    Odeslat
                </button>
            </div>

        </div>
    `;
}

function zobrazitPotvrzeni(text) {

    const okno = document.createElement("div");

    okno.style.position = "fixed";
    okno.style.top = "50%";
    okno.style.left = "50%";
    okno.style.transform = "translate(-50%, -50%)";
    okno.style.minWidth = "300px";
    okno.style.maxWidth = "80%";
    okno.style.padding = "25px 35px";
    okno.style.background = "rgba(18,15,12,.98)";
    okno.style.border = "2px solid #8a704d";
    okno.style.boxShadow = "0 0 40px rgba(0,0,0,.85)";
    okno.style.color = "#eee4d2";
    okno.style.fontFamily = 'Georgia, "Times New Roman", serif';
    okno.style.fontSize = "20px";
    okno.style.textAlign = "center";
    okno.style.zIndex = "9999";

    okno.textContent = text;

    document.body.appendChild(okno);

    setTimeout(function() {
        okno.remove();
    }, 1500);
}

async function odeslatZpravu() {

    const { data: { user } } =
        await supabaseClient.auth.getUser();

    if (!user) {
        zobrazitPotvrzeni("Nejsi přihlášený.");
        return;
    }

    const vyberPrijemce = document.getElementById("prijemceZpravy");
const prijemce = vyberPrijemce.value;
const prijemceUserId =
    vyberPrijemce.selectedOptions[0]?.dataset.userId;
    const predmet = document.getElementById("predmetZpravy").value.trim();
    const text = document.getElementById("textZpravy").value.trim();

    if (!prijemce) {
        zobrazitPotvrzeni("Vyber příjemce.");
        return;
    }

    if (!text) {
        zobrazitPotvrzeni("Napiš zprávu.");
        return;
    }

 const postavaId = new URLSearchParams(
    window.location.search
).get("id");

if (!postavaId) {
    zobrazitPotvrzeni("Chybí ID odesílající postavy.");
    return;
}

const { error } =
    await supabaseClient
        .from("zpravy")
        .insert({
            odesilatel_id: user.id,
            prijemce_id: prijemceUserId,
            odesilatel_postava_id: Number(postavaId),
            prijemce_postava_id: Number(prijemce),
            predmet: predmet || null,
            text: text,
            precteno: false
        });

    if (error) {
        console.error("Chyba při odesílání zprávy:", error);
        zobrazitPotvrzeni("Zprávu se nepodařilo odeslat.");
        return;
    }

zobrazitPotvrzeni("Zpráva byla odeslána.");

setTimeout(function() {
    zobrazitDorucene();
}, 1200);
}


async function smazatZpravu(id) {
    const pozadi = document.createElement("div");
    pozadi.className = "vlastni-okno-pozadi";

    const okno = document.createElement("div");
    okno.className = "vlastni-okno";

    const zprava = document.createElement("div");
    zprava.textContent = "Opravdu chceš tuto zprávu smazat?";

    const tlacitka = document.createElement("div");
    tlacitka.className = "vlastni-okno-tlacitka";

    const ano = document.createElement("button");
    ano.type = "button";
    ano.textContent = "Ano";

    const ne = document.createElement("button");
    ne.type = "button";
    ne.textContent = "Ne";

    tlacitka.append(ano, ne);
    okno.append(zprava, tlacitka);
    pozadi.appendChild(okno);
    document.body.appendChild(pozadi);

    ne.onclick = function () {
        pozadi.remove();
    };

    ano.onclick = async function () {
        pozadi.remove();

        const { data: { user } } =
            await supabaseClient.auth.getUser();

        if (!user) {
            zobrazitPotvrzeni("Nejsi přihlášený.");
            return;
        }

        const { data, error } = await supabaseClient
            .from("zpravy")
            .delete()
            .eq("id", id)
            .eq(
    "prijemce_postava_id",
    Number(new URLSearchParams(window.location.search).get("id"))
)
            .select("id");

        if (error) {
            console.error("Chyba při mazání zprávy:", error);
            zobrazitPotvrzeni("Zprávu se nepodařilo smazat.");
            return;
        }

        if (!data || data.length === 0) {
            zobrazitPotvrzeni(
                "Zpráva nebyla smazána. Zkontroluj oprávnění."
            );
            return;
        }

        zobrazitPotvrzeni("Zpráva byla smazána.");
        await zobrazitDorucene();
    };
}

</script>




</main>

</body>
</html>
