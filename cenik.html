
<!DOCTYPE html>
<html lang="cs">
<head>

<title>Ceník</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background-image: url("pozadi-inventar.jpg");
    background-position: center;
    background-size: cover;
    background-attachment: fixed;

    font-family: Georgia, serif;
}

.page {
    width: min(1240px, 96vw);
    margin: 40px auto;
    padding: 40px;
    background: rgba(20, 17, 14, 0.9);
    border: 2px solid #6f5a3e;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
}

h1 {
    margin-top: 0;
    margin-bottom: 15px;
    text-align: center;
    color: #d8c29d;
    font-size: 36px;
    font-weight: normal;
}

.uvod {
    text-align: center;
    margin-bottom: 35px;
    font-size: 17px;
    color: #c8b99f;
    line-height: 1.5;
}

h2 {
    margin: 40px 0 15px;
    padding-bottom: 8px;
    border-bottom: 1px solid #6f5a3e;
    color: #d8c29d;
    font-size: 27px;
    font-weight: normal;
}

h3 {
    margin: 25px 0 12px;
    color: #d6c19e;
    font-size: 21px;
    font-weight: normal;
}

.tabulka-obal {
    width: 100%;
    overflow-x: auto;
    margin-bottom: 20px;
}

.cenik-tabulka {
    width: 100%;
    border-collapse: collapse;
    min-width: 450px;
}

.cenik-tabulka th {
    background: linear-gradient(
        180deg,
        rgba(210, 190, 155, 0.85) 0%,
        rgba(190, 165, 125, 0.75) 50%,
        rgba(145, 120, 85, 0.75) 100%
    );
    color: #1a1510;
    border: 1px solid #6f5a3e;
    padding: 11px 10px;
    text-align: left;
    white-space: nowrap;
}

.cenik-tabulka td {
    border: 1px solid #6f5a3e;
    padding: 9px 10px;
    vertical-align: top;
    line-height: 1.4;
}

.cenik-tabulka tbody tr:nth-child(even) {
    background: rgba(60, 48, 35, 0.35);
}

.cenik-tabulka tbody tr:hover {
    background: rgba(120, 95, 60, 0.2);
}

.poznamka {
    margin: 10px 0 25px;
    padding: 12px 15px;
    border-left: 3px solid #8a704d;
    background: rgba(50, 40, 29, 0.65);
    color: #d8c29d;
    line-height: 1.5;
}

.chyba {
    text-align: center;
    padding: 30px;
    color: #e0b9a0;
    font-size: 18px;
    line-height: 1.6;
}

.nacitani {
    text-align: center;
    padding: 30px;
    color: #d8c29d;
    font-size: 18px;
}

.zpet {
    display: block;
    margin: 40px auto 0;
    padding: 14px 28px;
    font-family: inherit;
    font-size: 19px;
    color: #eee4d2;
    background: linear-gradient(
        180deg,
        #403222 0%,
        #241b13 100%
    );
    border: 1px solid #8a704d;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
}

.zpet:hover {
    background: #473827;
    border-color: #b39468;
}

@media (max-width: 700px) {
    .page {
        padding: 20px 14px;
        margin: 15px auto;
    }

    h1 {
        font-size: 29px;
    }

    h2 {
        font-size: 23px;
    }

    .cenik-tabulka {
        font-size: 14px;
    }

    .cenik-tabulka th,
    .cenik-tabulka td {
        padding: 7px;
    }
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://xahjqqyjaxbhdmairkfr.supabase.co";
const SUPABASE_KEY = "sb_publishable_OBIbH7JzU_A96jXlht_2FA_Yadsooqu";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
</script>
</head>

<body>

<div class="page">

    <h1>Ceník</h1>

    <div class="uvod">
        Orientační ceny zboží, služeb a vybavení.
        Skutečné ceny se mohou v jednotlivých obchodech lišit.
    </div>

    <div id="obsahCeniku">
        <div class="nacitani">Načítám ceník...</div>
    </div>

    <button class="zpet" type="button" onclick="window.close()">
        Zavřít
    </button>

</div>

<script>

const nazvySloupcu = {
    nazev: "Název",
    cena: "Cena",
    mnozstvi: "Množství",
    hmotnost: "Hmotnost",
    mzda: "Mzda",
    typ: "Typ",
    zpusob_drzeni: "Způsob držení",
    druh_poskozeni: "Druh poškození",
    vaha: "Váha",
    utok: "Útok",
    kryt: "Kryt",
    poskozeni: "Poškození",
    vzdalenost: "Vzdálenost",
    hodnota: "Hodnota zbroje",
    hodnota_zbroje: "Hodnota zbroje",
    poznamka: "Poznámka",
    bonus: "Bonus"
};


function vytvoritTabulku(polozky) {

    if (!Array.isArray(polozky) || polozky.length === 0) {
        return "";
    }

// Zachováme pořadí sloupců podle prvního výskytu v datech.
const klice = [];

polozky.forEach(polozka => {
    Object.keys(polozka).forEach(klic => {
        if (!klice.includes(klic)) {
            klice.push(klic);
        }
    });
});

// Název bude vždy první a cena poslední.
if (klice.includes("nazev")) {
    klice.splice(klice.indexOf("nazev"), 1);
    klice.unshift("nazev");
}

if (klice.includes("cena")) {
    klice.splice(klice.indexOf("cena"), 1);
    klice.push("cena");
}

    let html = `
        <div class="tabulka-obal">
            <table class="cenik-tabulka">
                <thead>
                    <tr>
    `;

    klice.forEach(klic => {
        html += `<th>${escapeHtml(nazvySloupcu[klic] || klic)}</th>`;
    });

    html += `
                    </tr>
                </thead>
                <tbody>
    `;

    polozky.forEach(polozka => {

        html += "<tr>";

        klice.forEach(klic => {

            const hodnota = polozka[klic] ?? "";

            html += `<td>${escapeHtml(String(hodnota))}</td>`;

        });

        html += "</tr>";

    });

    html += `
                </tbody>
            </table>
        </div>
    `;

    return html;
}


function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function vytvoritSekci(nadpis, polozky, poznamka = "") {

    if (!Array.isArray(polozky) || polozky.length === 0) {
        return "";
    }

    let html = `<h2>${escapeHtml(nadpis)}</h2>`;

    html += vytvoritTabulku(polozky);

    if (poznamka) {
        html += `
            <div class="poznamka">
                ${escapeHtml(poznamka)}
            </div>
        `;
    }

    return html;
}


function vytvoritPodsekce(nadpis, skupiny) {

    if (!skupiny || typeof skupiny !== "object") {
        return "";
    }

    let html = `<h2>${escapeHtml(nadpis)}</h2>`;

    Object.entries(skupiny).forEach(([nazev, polozky]) => {

        if (!Array.isArray(polozky) || polozky.length === 0) {
            return;
        }

        html += `<h3>${escapeHtml(nazev)}</h3>`;
        html += vytvoritTabulku(polozky);

    });

    return html;
}


function zobrazitCenik(data) {

    let html = "";

    // Jídlo a suroviny
    html += vytvoritSekci(
        "Jídlo a suroviny",
        data.jidlo_suroviny
    );

    // Služby a zvířata
    html += vytvoritSekci(
        "Služby",
        data.sluzby
    );

    html += vytvoritSekci(
        "Zvířata",
        data.zvirata
    );

    // Zbraně
    html += vytvoritSekci(
        "Zbraně",
        data.zbrane,
        data.poznamka_zbrane
    );

    // Zbroje
    if (data.zbroje) {

        html += vytvoritPodsekce(
            "Zbroje",
            data.zbroje
        );

        if (data.poznamka_zbroje) {
            html += `
                <div class="poznamka">
                    ${escapeHtml(data.poznamka_zbroje)}
                </div>
            `;
        }
    }

    // Předměty a vybavení
    html += vytvoritSekci(
        "Předměty a vybavení",
        data.predmety_vybaveni
    );

    // Přeprava
    if (data.preprava) {

        html += vytvoritPodsekce(
            "Přeprava a výstroj",
            {
                "Výstroj pro koně": data.preprava.vystroj_pro_kone,
                "Dopravní prostředky": data.preprava.dopravni_prostredky
            }
        );
    }

  // Materiály
html += vytvoritSekci(
    "Materiály",
    data.materialy
);

// Drahokamy
html += vytvoritSekci(
    "Drahokamy",
    data.drahokamy
);

// Šperky
html += vytvoritSekci(
    "Šperky",
    data.sperky
);

    // Kvalita zpracování
    html += vytvoritSekci(
        "Kvalita zpracování",
        data.kvalita_zpracovani
    );

    // Alchymie
    if (data.alchymie_suroviny) {

        html += vytvoritPodsekce(
            "Alchymie – suroviny",
            data.alchymie_suroviny
        );
    }

    html += vytvoritSekci(
        "Alchymie – výrobky",
        data.alchymie_vyrobky
    );

    // Mzdy
    html += vytvoritSekci(
        "Mzdy",
        data.mzdy
    );



    if (!html) {
        document.getElementById("obsahCeniku").innerHTML =
            '<div class="chyba">Ceník neobsahuje žádné položky.</div>';
        return;
    }

    document.getElementById("obsahCeniku").innerHTML = html;
}


async function nacistCenik() {

    const obsah = document.getElementById("obsahCeniku");

    const { data, error } = await supabaseClient
        .from("cenik")
        .select("obsah")
        .eq("id", 1)
        .single();

console.log("CENÍK DATA:", data);
console.log("CENÍK ERROR:", error);

    if (error) {

        console.error("Chyba při načítání ceníku:", error);

        obsah.innerHTML = `
            <div class="chyba">
                Ceník se nepodařilo načíst.<br>
                Zkontroluj připojení k Supabase a obsah databáze.
            </div>
        `;

        return;
    }

    if (!data || !data.obsah) {

        obsah.innerHTML = `
            <div class="chyba">
                V databázi nebyl nalezen žádný obsah ceníku.
            </div>
        `;

        return;
    }

    zobrazitCenik(data.obsah);
}


nacistCenik();

</script>

</body>
</html>
